{% load static %}{% load i18n %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block meta_title %}{{ brand_name }}{% endblock %}</title>
<meta name="description" content="{% block meta_description %}{% trans 'Premium fruit products crafted with nature in mind.' %}{% endblock %}">
<meta property="og:title" content="{% block og_title %}{{ brand_name }}{% endblock %}">
<meta property="og:description" content="{% block og_description %}{% trans 'Premium fruit products crafted with nature in mind.' %}{% endblock %}">
<link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
